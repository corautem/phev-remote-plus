name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check string resources
        run: |
          set -o pipefail
          python3 tools/check_strings.py 2>&1 | tee -a build.log

      - name: Test protocol core and bridge
        run: |
          set -o pipefail
          ./gradlew :core:test :bridge:test --stacktrace 2>&1 | tee -a build.log

      - name: Build bridge
        run: |
          set -o pipefail
          ./gradlew :bridge:fatJar --stacktrace 2>&1 | tee -a build.log

      - name: Build Android app
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PHEV-Link-1.0.${{ github.run_number }}.apk"
          cp bridge/build/dist/phev-bridge.jar out/
          # One-file bundle for the Raspberry Pi: jar + installer + systemd unit.
          mkdir -p bundle/phev-bridge
          cp bridge/build/dist/phev-bridge.jar bridge/deploy/install.sh bridge/deploy/carwifi.sh bridge/deploy/phev-bridge.service bundle/phev-bridge/
          chmod +x bundle/phev-bridge/install.sh bundle/phev-bridge/carwifi.sh
          tar -czf out/phev-bridge-pi.tar.gz -C bundle phev-bridge
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phev-link-1.0.${{ github.run_number }}
          path: out/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/* \
            --title "PHEV Link 1.0.${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Install the APK on your phone; copy phev-bridge.jar to the Raspberry Pi for remote access." \
            --latest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

      # Make failures readable through the plain GitHub API: errors become annotations,
      # and the full log is committed to the ci-logs branch.
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errs=$(grep -E "^e: |error:|ERROR:|What went wrong|FAILED|Exception" build.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g' || true)
          echo "::error title=Build errors::${errs}"
          content=$(tail -c 900000 build.log | base64 -w0)
          sha=$(gh api "repos/${{ github.repository }}/contents/build.log?ref=ci-logs" --jq .sha 2>/dev/null || true)
          if ! gh api "repos/${{ github.repository }}/branches/ci-logs" >/dev/null 2>&1; then
            main_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/heads/ci-logs -f sha="$main_sha" >/dev/null
          fi
          args=(-X PUT "repos/${{ github.repository }}/contents/build.log" -f message="CI log run ${{ github.run_number }}" -f branch=ci-logs -f content="$content")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api "${args[@]}" >/dev/null

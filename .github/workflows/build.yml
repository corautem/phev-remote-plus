name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test protocol core
        run: ./gradlew :core:test --stacktrace

      - name: Build bridge
        run: ./gradlew :bridge:fatJar --stacktrace

      - name: Build Android app
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PHEV-Link-1.0.${{ github.run_number }}.apk"
          cp bridge/build/dist/phev-bridge.jar out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phev-link-1.0.${{ github.run_number }}
          path: out/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/* \
            --title "PHEV Link 1.0.${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Install the APK on your phone; copy phev-bridge.jar to the Raspberry Pi for remote access." \
            --latest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
